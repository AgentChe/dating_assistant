name: dating_assistant
description: "Dating Assistant: AI analysis of a couple's communication."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  animations: ^2.2.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2
  image_picker: ^1.2.4
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  in_app_purchase_platform_interface: ^1.4.1
  in_app_purchase_storekit: ^0.4.17
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  image_picker_platform_interface: ^2.11.2

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/home/
    - assets/images/icons_3d/
    - assets/images/onboarding/
    - assets/images/splash/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
