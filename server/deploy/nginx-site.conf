# Сайт nginx для сервера Cue: HTTPS снаружи, служба cue-server на 127.0.0.1:8401 внутри.
# DOMAIN подставляет deploy.sh; сертификат Let's Encrypt выпускает certbot и сам дописывает сюда listen 443.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # Скриншот в base64 и разговор — до 15 МБ, как предел самого сервера.
    client_max_body_size 16m;

    # В логах nginx — строка запроса, код и время; тела запросов со скриншотами туда не попадают.
    access_log /var/log/nginx/DOMAIN.access.log;
    error_log /var/log/nginx/DOMAIN.error.log;

    location / {
        proxy_pass http://127.0.0.1:8401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Модель отвечает до 45 секунд — сервер обрывает её сам, nginx ждёт с запасом.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
